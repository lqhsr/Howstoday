#   api_key_env: "VISION_API_KEY"
#   timeout: 120
#   # use_proxy: true              # 默认远程会走系统代理
#
# llm:
#   model: "qwen-plus"
#   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
#   api_key: ""
#   api_key_env: "LLM_API_KEY"
#   timeout: 120
#   temperature: 0.3

data:
  base_dir: "./data"
  screenshot_dir: "./data/screenshots"
